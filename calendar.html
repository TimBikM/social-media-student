<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classmates | Calendar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Customizing FullCalendar to look more modern and match Tailwind */
        :root {
            --fc-border-color: #e2e8f0;
            --fc-button-bg-color: #fff;
            --fc-button-border-color: #cbd5e1;
            --fc-button-text-color: #475569;
            --fc-button-hover-bg-color: #f1f5f9;
            --fc-button-hover-border-color: #cbd5e1;
            --fc-button-active-bg-color: #e2e8f0;
            --fc-button-active-border-color: #cbd5e1;
            --fc-event-bg-color: #3b82f6;
            --fc-event-border-color: #3b82f6;
            --fc-today-bg-color: #eff6ff;
        }
        
        .fc {
            font-family: 'Inter', sans-serif;
        }
        
        .fc-toolbar-title {
            font-size: 1.25rem !important;
            font-weight: 500 !important;
            color: #1e293b;
        }

        .fc-button {
            text-transform: capitalize !important;
            font-weight: 500 !important;
            border-radius: 0.375rem !important;
            padding: 0.5rem 1rem !important;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important;
            transition: all 0.2s !important;
        }

        .fc-button-primary:not(:disabled).fc-button-active, 
        .fc-button-primary:not(:disabled):active {
            background-color: #e2e8f0 !important;
            color: #0f172a !important;
        }

        .fc-event {
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .fc-event:hover {
            opacity: 0.9;
        }

        .fc-col-header-cell-cushion {
            color: #475569;
            font-weight: 500;
            padding: 8px 0 !important;
        }

        .fc-daygrid-day-number {
            color: #334155;
            font-weight: 500;
            padding: 8px !important;
        }
    </style>
</head>
<body class="bg-white text-slate-800 antialiased h-screen overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="flex-none bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4 sm:px-6 z-10">
        <div class="flex items-center gap-4">
            <button class="text-slate-500 hover:text-slate-700 p-2 rounded-full hover:bg-slate-100 transition-colors">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded text-brand-600 flex items-center justify-center text-2xl">
                    <i class="fa-regular fa-calendar-days"></i>
                </div>
                <span class="font-medium text-xl text-slate-700">My Calendar</span>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <!-- Local Status Indicator -->
            <div class="hidden sm:flex items-center gap-2 text-sm text-slate-500 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-200">
                <div class="w-2 h-2 rounded-full bg-green-500"></div>
                Saving Locally
            </div>
            
            <div class="h-8 w-8 rounded-full bg-slate-200 overflow-hidden border border-slate-300 cursor-pointer">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User" class="w-full h-full object-cover">
            </div>
        </div>
    </header>

    <!-- Main App Container -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 border-r border-slate-200 bg-white flex flex-col hidden md:flex flex-shrink-0">
            <div class="p-4">
                <button onclick="openModal()" class="flex items-center gap-2 bg-brand-600 hover:bg-brand-700 shadow-sm hover:shadow text-white px-4 py-3 rounded-full text-sm font-medium transition-all w-full justify-center">
                    <i class="fa-solid fa-plus"></i>
                    Create Event
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 pt-2">
                <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Calendar Features</h3>
                <ul class="space-y-3 text-sm text-slate-600">
                    <li class="flex items-start gap-2">
                        <i class="fa-solid fa-check text-green-500 mt-0.5"></i>
                        <span>Click any date to quickly add an event.</span>
                    </li>
                    <li class="flex items-start gap-2">
                        <i class="fa-solid fa-check text-green-500 mt-0.5"></i>
                        <span>Click an existing event to delete it.</span>
                    </li>
                </ul>
                
                <div class="mt-8 pt-6 border-t border-slate-100">
                    <button onclick="clearAllEvents()" class="w-full text-left text-sm text-red-500 hover:text-red-700 hover:bg-red-50 py-2 px-3 rounded transition-colors flex items-center gap-2">
                        <i class="fa-regular fa-trash-can"></i>
                        Clear All Events
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Calendar Area -->
        <main class="flex-1 bg-white overflow-hidden p-4 sm:p-6 h-full flex flex-col">
            <div id="calendar" class="flex-1 h-full"></div>
        </main>
    </div>

    <!-- Add Event Modal -->
    <div id="eventModal" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            
            <!-- Background overlay -->
            <div class="fixed inset-0 bg-slate-900 bg-opacity-50 transition-opacity" aria-hidden="true" onclick="closeModal()"></div>

            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <!-- Modal panel -->
            <div class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                    <h3 class="text-lg leading-6 font-medium text-slate-900" id="modal-title">
                        Add New Event
                    </h3>
                    <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-500 focus:outline-none">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                
                <form id="eventForm" class="p-6">
                    <div class="space-y-5">
                        <div>
                            <input type="text" id="eventTitle" placeholder="Add event title" required class="block w-full text-xl py-2 border-0 border-b-2 border-slate-200 focus:border-brand-500 focus:ring-0 placeholder-slate-400 font-medium bg-transparent transition-colors">
                        </div>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label for="eventStart" class="block text-sm font-medium text-slate-700 mb-1">Start Date & Time</label>
                                <input type="datetime-local" id="eventStart" required class="block w-full py-2 px-3 border border-slate-300 rounded-lg text-sm focus:ring-brand-500 focus:border-brand-500">
                            </div>
                            <div>
                                <label for="eventEnd" class="block text-sm font-medium text-slate-700 mb-1">End Date & Time</label>
                                <input type="datetime-local" id="eventEnd" class="block w-full py-2 px-3 border border-slate-300 rounded-lg text-sm focus:ring-brand-500 focus:border-brand-500">
                            </div>
                        </div>

                        <div class="flex items-center justify-between">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" id="eventAllDay" class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 border-slate-300">
                                <span class="text-sm text-slate-700">All day event</span>
                            </label>

                            <div class="flex items-center gap-2">
                                <label class="text-sm text-slate-600">Color:</label>
                                <input type="color" id="eventColor" value="#3b82f6" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                            </div>
                        </div>
                    </div>

                    <div class="mt-8 flex justify-end gap-3">
                        <button type="button" onclick="closeModal()" class="bg-white py-2 px-4 border border-slate-300 rounded-lg shadow-sm text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors">
                            Cancel
                        </button>
                        <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-lg text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors">
                            Save Event
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- FullCalendar Logic with LocalStorage Persistence -->
    <script>
        const LOCAL_STORAGE_KEY = 'my_local_calendar_events';
        let calendar;

        // Load events from Local Storage
        function getSavedEvents() {
            const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (e) {
                    console.error("Error parsing local events", e);
                    return [];
                }
            }
            // Return some demo data if completely empty
            return [
                {
                    id: 'demo-1',
                    title: 'Welcome to your Calendar!',
                    start: new Date().toISOString().split('T')[0],
                    allDay: true,
                    backgroundColor: '#10b981',
                    borderColor: '#10b981'
                }
            ];
        }

        // Save current events to Local Storage
        function saveEventsToLocal() {
            if (!calendar) return;
            const events = calendar.getEvents().map(e => ({
                id: e.id,
                title: e.title,
                start: e.startStr,
                end: e.endStr || null,
                allDay: e.allDay,
                backgroundColor: e.backgroundColor,
                borderColor: e.borderColor
            }));
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(events));
        }

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'today prev,next',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                themeSystem: 'standard',
                height: '100%',
                selectable: true,
                editable: true,
                dayMaxEvents: true,
                events: getSavedEvents(),

                // Save events whenever they are dragged or resized
                eventChange: function(info) {
                    saveEventsToLocal();
                },

                // Triggered when a user clicks on a date/time slot
                select: function(info) {
                    openModal(info.startStr, info.endStr, info.allDay);
                },

                // Triggered when a user clicks on an existing event
                eventClick: function(info) {
                    if (confirm(`Do you want to delete the event: '${info.event.title}'?`)) {
                        info.event.remove();
                        saveEventsToLocal();
                    }
                }
            });
            
            calendar.render();

            // Handle Modal Form Submission
            document.getElementById('eventForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const title = document.getElementById('eventTitle').value;
                const start = document.getElementById('eventStart').value;
                const end = document.getElementById('eventEnd').value;
                const allDay = document.getElementById('eventAllDay').checked;
                const color = document.getElementById('eventColor').value;

                if (title && start) {
                    const newEventData = {
                        id: 'evt-' + Date.now(), // Generate a unique local ID
                        title: title,
                        start: start,
                        end: end ? end : null,
                        allDay: allDay,
                        backgroundColor: color,
                        borderColor: color
                    };

                    calendar.addEvent(newEventData);
                    saveEventsToLocal();
                    closeModal();
                }
            });
        });

        // Clear all events utility
        function clearAllEvents() {
            if(confirm("Are you sure you want to delete ALL events? This cannot be undone.")) {
                calendar.removeAllEvents();
                localStorage.removeItem(LOCAL_STORAGE_KEY);
            }
        }

        // --- Modal Control Functions ---
        const modal = document.getElementById('eventModal');

        function openModal(startStr = '', endStr = '', allDay = false) {
            document.getElementById('eventForm').reset();
            document.getElementById('eventColor').value = '#3b82f6'; // Reset to default blue
            
            // Format dates for datetime-local input if provided
            if (startStr) {
                const formattedStart = startStr.length > 16 ? startStr.slice(0, 16) : startStr + 'T09:00';
                document.getElementById('eventStart').value = formattedStart;
            }
            if (endStr) {
                const formattedEnd = endStr.length > 16 ? endStr.slice(0, 16) : endStr + 'T10:00';
                document.getElementById('eventEnd').value = formattedEnd;
            }
            
            document.getElementById('eventAllDay').checked = allDay;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
        }
    </script>
</body>
</html>
