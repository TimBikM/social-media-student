<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Integration</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Customizing FullCalendar to look more like Google Calendar and match Tailwind */
        :root {
            --fc-border-color: #e2e8f0;
            --fc-button-bg-color: #fff;
            --fc-button-border-color: #cbd5e1;
            --fc-button-text-color: #475569;
            --fc-button-hover-bg-color: #f1f5f9;
            --fc-button-hover-border-color: #cbd5e1;
            --fc-button-active-bg-color: #e2e8f0;
            --fc-button-active-border-color: #cbd5e1;
            --fc-event-bg-color: #3b82f6;
            --fc-event-border-color: #3b82f6;
            --fc-today-bg-color: #eff6ff;
        }
        
        .fc {
            font-family: 'Inter', sans-serif;
        }
        
        .fc-toolbar-title {
            font-size: 1.25rem !important;
            font-weight: 500 !important;
            color: #1e293b;
        }

        .fc-button {
            text-transform: capitalize !important;
            font-weight: 500 !important;
            border-radius: 0.375rem !important;
            padding: 0.5rem 1rem !important;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important;
            transition: all 0.2s !important;
        }

        .fc-button-primary:not(:disabled).fc-button-active, 
        .fc-button-primary:not(:disabled):active {
            background-color: #e2e8f0 !important;
            color: #0f172a !important;
        }

        .fc-event {
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .fc-event:hover {
            opacity: 0.9;
        }

        .fc-col-header-cell-cushion {
            color: #475569;
            font-weight: 500;
            padding: 8px 0 !important;
        }

        .fc-daygrid-day-number {
            color: #334155;
            font-weight: 500;
            padding: 8px !important;
        }
    </style>
</head>
<body class="bg-white text-slate-800 antialiased h-screen overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="flex-none bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4 sm:px-6 z-10">
        <div class="flex items-center gap-4">
            <button class="text-slate-500 hover:text-slate-700 p-2 rounded-full hover:bg-slate-100 transition-colors">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded text-brand-600 flex items-center justify-center text-2xl">
                    <i class="fa-regular fa-calendar-days"></i>
                </div>
                <span class="font-medium text-xl text-slate-700">Calendar</span>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <!-- Google Sync Button -->
            <button id="google-auth-btn" class="flex items-center gap-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-full text-sm font-medium transition-colors shadow-sm">
                <i class="fa-brands fa-google text-red-500"></i>
                <span id="google-auth-text">Connect Google Calendar</span>
            </button>
            
            <div class="h-8 w-8 rounded-full bg-slate-200 overflow-hidden border border-slate-300 cursor-pointer">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User" class="w-full h-full object-cover">
            </div>
        </div>
    </header>

    <!-- Main App Container -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 border-r border-slate-200 bg-white flex flex-col hidden md:flex flex-shrink-0">
            <div class="p-4">
                <button onclick="openModal()" class="flex items-center gap-2 bg-white border border-slate-200 shadow-sm hover:shadow-md text-slate-700 px-4 py-3 rounded-full text-sm font-medium transition-all w-full justify-center">
                    <i class="fa-solid fa-plus text-brand-500"></i>
                    Create Event
                </button>
            </div>

            <!-- Mini Calendar Placeholder / Datepicker -->
            <div class="px-4 py-2 border-b border-slate-100 pb-6">
                <!-- A real implementation might use a tiny datepicker here. We use a static placeholder for UI -->
                <div class="text-sm font-medium text-slate-800 mb-4 ml-2">October 2026</div>
                <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-500 mb-2">
                    <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-sm">
                    <div class="text-slate-300 py-1">27</div><div class="text-slate-300 py-1">28</div><div class="text-slate-300 py-1">29</div><div class="text-slate-300 py-1">30</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">1</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">2</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">3</div>
                    <!-- Row 2 -->
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">4</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">5</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">6</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">7</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">8</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">9</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">10</div>
                    <!-- Row 3 -->
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">11</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">12</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">13</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">14</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">15</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">16</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">17</div>
                    <!-- Row 4 -->
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">18</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">19</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">20</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">21</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">22</div>
                    <div class="py-1 hover:bg-slate-100 rounded-full cursor-pointer">23</div>
                    <div class="bg-brand-100 text-brand-700 py-1 rounded-full font-semibold cursor-pointer">24</div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-4">
                <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">My Calendars</h3>
                <div class="space-y-2">
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" checked class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 border-slate-300">
                        <span class="text-sm text-slate-700 group-hover:text-slate-900">Personal</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" checked class="w-4 h-4 rounded text-green-500 focus:ring-green-500 border-slate-300">
                        <span class="text-sm text-slate-700 group-hover:text-slate-900">Work</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" checked class="w-4 h-4 rounded text-purple-500 focus:ring-purple-500 border-slate-300">
                        <span class="text-sm text-slate-700 group-hover:text-slate-900">Forum Events</span>
                    </label>
                </div>
            </div>
        </aside>

        <!-- Main Calendar Area -->
        <main class="flex-1 bg-white overflow-hidden p-4 sm:p-6 h-full flex flex-col">
            <div id="calendar" class="flex-1 h-full"></div>
        </main>
    </div>

    <!-- Add Event Modal -->
    <div id="eventModal" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            
            <!-- Background overlay -->
            <div class="fixed inset-0 bg-slate-900 bg-opacity-50 transition-opacity" aria-hidden="true" onclick="closeModal()"></div>

            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <!-- Modal panel -->
            <div class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                    <h3 class="text-lg leading-6 font-medium text-slate-900" id="modal-title">
                        Add New Event
                    </h3>
                    <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-500 focus:outline-none">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                
                <form id="eventForm" class="p-6">
                    <div class="space-y-5">
                        <div>
                            <input type="text" id="eventTitle" placeholder="Add title" required class="block w-full text-xl py-2 border-0 border-b-2 border-slate-200 focus:border-brand-500 focus:ring-0 placeholder-slate-400 font-medium bg-transparent transition-colors">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="eventStart" class="block text-sm font-medium text-slate-700 mb-1">Start Date & Time</label>
                                <input type="datetime-local" id="eventStart" required class="block w-full py-2 px-3 border border-slate-300 rounded-lg text-sm focus:ring-brand-500 focus:border-brand-500">
                            </div>
                            <div>
                                <label for="eventEnd" class="block text-sm font-medium text-slate-700 mb-1">End Date & Time</label>
                                <input type="datetime-local" id="eventEnd" class="block w-full py-2 px-3 border border-slate-300 rounded-lg text-sm focus:ring-brand-500 focus:border-brand-500">
                            </div>
                        </div>

                        <div>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" id="eventAllDay" class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 border-slate-300">
                                <span class="text-sm text-slate-700">All day event</span>
                            </label>
                        </div>
                    </div>

                    <div class="mt-8 flex justify-end gap-3">
                        <button type="button" onclick="closeModal()" class="bg-white py-2 px-4 border border-slate-300 rounded-lg shadow-sm text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors">
                            Cancel
                        </button>
                        <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-lg text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors">
                            Save Event
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- FullCalendar Initialization and Logic -->
    <script>
        let calendar; // Global calendar instance

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'today prev,next',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                themeSystem: 'standard',
                height: '100%',
                selectable: true,
                editable: true,
                dayMaxEvents: true, // Allow "more" link when too many events
                
                // Demo Data
                events: [
                    {
                        title: 'Forum Code Review',
                        start: new Date(new Date().setHours(10, 0, 0, 0)),
                        end: new Date(new Date().setHours(11, 30, 0, 0)),
                        backgroundColor: '#3b82f6', // blue
                        borderColor: '#3b82f6'
                    },
                    {
                        title: 'Release Version 1.0',
                        start: new Date(new Date().setDate(new Date().getDate() + 2)),
                        allDay: true,
                        backgroundColor: '#10b981', // green
                        borderColor: '#10b981'
                    }
                ],

                // Triggered when a user clicks on a date/time slot
                select: function(info) {
                    openModal(info.startStr, info.endStr, info.allDay);
                },

                // Triggered when a user clicks on an existing event
                eventClick: function(info) {
                    if (confirm(`Do you want to delete the event: '${info.event.title}'?`)) {
                        
                        // 1. Remove from UI
                        info.event.remove();
                        
                        // 2. [TODO] Remove from Google Calendar API (See Scaffolding Below)
                        deleteEventFromGoogleAPI(info.event.id || info.event.extendedProps.googleEventId);
                    }
                }
            });
            
            calendar.render();

            // Handle Modal Form Submission
            document.getElementById('eventForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const title = document.getElementById('eventTitle').value;
                const start = document.getElementById('eventStart').value;
                const end = document.getElementById('eventEnd').value;
                const allDay = document.getElementById('eventAllDay').checked;

                if (title && start) {
                    const newEventData = {
                        id: String(Math.random()), // Temp ID
                        title: title,
                        start: start,
                        end: end ? end : null,
                        allDay: allDay
                    };

                    // 1. Add to UI
                    calendar.addEvent(newEventData);
                    
                    // 2. [TODO] Add to Google Calendar API (See Scaffolding Below)
                    addEventToGoogleAPI(newEventData);

                    closeModal();
                }
            });
        });

        // --- Modal Control Functions ---
        const modal = document.getElementById('eventModal');

        function openModal(startStr = '', endStr = '', allDay = false) {
            document.getElementById('eventForm').reset();
            
            // Format dates for datetime-local input if provided
            if (startStr) {
                // Slicing to fit HTML5 datetime-local format (YYYY-MM-DDThh:mm)
                const formattedStart = startStr.length > 16 ? startStr.slice(0, 16) : startStr + 'T09:00';
                document.getElementById('eventStart').value = formattedStart;
            }
            if (endStr) {
                const formattedEnd = endStr.length > 16 ? endStr.slice(0, 16) : endStr + 'T10:00';
                document.getElementById('eventEnd').value = formattedEnd;
            }
            
            document.getElementById('eventAllDay').checked = allDay;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
        }

            document.getElementById('google-auth-btn').classList.replace('text-slate-700', 'text-green-600');

            fetchEventsFromGoogleAPI();
        }

    </script>
</body>
