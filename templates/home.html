<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 flex items-center justify-center p-6">
    <main class="w-full max-w-lg rounded-2xl border border-slate-100 bg-white p-8 text-center shadow-xl">
        <h1 class="text-2xl font-bold text-slate-900">You are signed in</h1>
        <p class="mt-3 text-slate-600">Welcome, {{ request.user.username }}.</p>
        <form class="mt-6" method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700" type="submit">
                Sign out
            </button>
        </form>
    </main>
</body>
</html>
